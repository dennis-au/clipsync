services:
  clipboard:
    environment:
      # Only the fixed cloudflared peer below may supply CF-Connecting-IP.
      CLIPSYNC_TRUSTED_PROXY_CIDRS: 172.28.0.3/32
    networks:
      clipsync:
        ipv4_address: 172.28.0.2

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      clipboard:
        condition: service_healthy
    networks:
      clipsync:
        ipv4_address: 172.28.0.3

networks:
  clipsync:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/29
